# Serve o dashboard e encaminha /api e /ws para a API na rede interna do compose.
# Com isso o navegador fala com uma origem só, e o CORS de produção fica sendo a
# própria origem do dashboard — não some, mas para de ser o caminho crítico.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA: qualquer rota desconhecida volta para o index.
  location / { try_files $uri $uri/ /index.html; }

  # 50 MB é o teto de upload da API (multer, fileSize). Menor aqui recusaria
  # antes, com erro do nginx em vez do erro tratado da aplicação.
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A mídia é transmitida em stream a partir da WAHA; sem isto o nginx
    # acumularia a resposta inteira antes de repassar.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /ws {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # O realtime fica ocioso entre eventos; o padrão de 60 s derrubaria a
    # conexão a cada minuto de silêncio.
    proxy_read_timeout 3600s;
  }
}
