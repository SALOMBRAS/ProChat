name: CI

on:
  pull_request:
    branches: [main]

# Uma PR que recebe vários pushes seguidos cancela as execuções anteriores.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Todo o monorepo vive em web/. O package.json da raiz é do Electron legado
    # (build/) e não tem package-lock.json, então npm ci só funciona aqui.
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Publicar cobertura
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
